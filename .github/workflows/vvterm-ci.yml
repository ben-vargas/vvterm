name: VVTerm CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: vvterm-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardrails:
    name: Architecture and release guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check architecture boundaries
        run: scripts/check_architecture.sh
      - name: Check changelog structure
        run: scripts/validate_changelog.rb
      - name: Check PR changelog decision
        if: github.event_name == 'pull_request'
        env:
          VVTERM_PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/validate_pr_changelog.sh "${{ github.event.pull_request.base.sha }}"
      - name: Check release inputs
        run: scripts/prepare_release.rb --check
      - name: Test release automation
        run: scripts/tests/prepare_release_test.rb

  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            destination: platform=macOS,arch=arm64
            result: macOS-build.xcresult
          - name: iOS Simulator arm64
            destination: generic/platform=iOS Simulator
            result: iOS-Simulator-build.xcresult
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build product
        run: >-
          xcodebuild build -quiet
          -project VVTerm.xcodeproj
          -scheme VVTerm
          -destination '${{ matrix.destination }}'
          -resultBundlePath '${{ runner.temp }}/${{ matrix.result }}'
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.result }}
          path: ${{ runner.temp }}/${{ matrix.result }}
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests on iOS Simulator arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select and boot an iPhone simulator
        run: |
          device_id="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse($stdin.read).fetch("devices").values.flatten
            phone = devices.find { |device| device.fetch("name").start_with?("iPhone") }
            abort "No available iPhone simulator" unless phone
            puts phone.fetch("udid")
          ')"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          echo "VVTERM_TEST_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
      - name: Run deterministic unit suite
        run: >-
          scripts/test.sh unit
          -resultBundlePath '${{ runner.temp }}/VVTermUnitTests.xcresult'
      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VVTermUnitTests.xcresult
          path: ${{ runner.temp }}/VVTermUnitTests.xcresult
          if-no-files-found: ignore
